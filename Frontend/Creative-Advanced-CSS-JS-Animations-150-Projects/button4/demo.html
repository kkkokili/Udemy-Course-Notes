<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@0,100..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <style>
      body {
        background: #f8f8f8;
      }
      button {
        padding: clamp(9px, 1.8vw, 40px) clamp(9px, 4vw, 70px);
        font-size: clamp(14px, 2vw, 30px);
        border: solid #e1332d 3px;
        color: #e1332d;
        font-family: "roboto";
        font-weight: 300;
        background-color: transparent;
        transition: letter-spacing 0.6s, font-weight 0.6s, border-width 0.6s;
      }

      button:hover {
        letter-spacing: 5px;
        font-weight: 700;
        border-width: 7px;
      }
    </style>
  </head>

  <body>
    <div
      class="container d-flex min-vh-100 justify-content-center align-items-center"
    >
      <button>BUTTON</button>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
